RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Microsoft/Microsoft.list,微软服务

# --- 8. 全球通用代理规则兜底 ---
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Proxy/Proxy.list,漏网之鱼

# --- 9. 地理位置 + 最终兜底 ---
GEOIP,CN,DIRECT,no-resolve
FINAL,漏网之鱼

[URL Rewrite]
# Google 重定向
'^https?://(www\.)?g\.cn' 'https://www.google.com' 302
'^https?://(www\.)?google\.cn' 'https://www.google.com' 302

# YouTube 广告优化
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad - reject

[Script]
# YouTube 增强（去广告 + 多语言字幕）
油管增强 = type=http-response, pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch))(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js,argument="{"lyricLang":"zh-Hans","captionLang":"zh-Hans","blockUpload":true,"blockImmersive":true,"blockShorts":false,"debug":false}"

# 墨鱼相关脚本
网页变身 = type=http-response, pattern=^https?:\/\/ddgksf2013.top\/$,requires-body=1,max-size=-1,script-path=https://ddgksf2013.top/scripts/web.rocket.js, timeout=3500

# Script-Hub 转换
脚本转换 = type=http-request, pattern=^https?:\/\/script\.hub\/file\/_start_\/.+type=(?:qx-rewrite|surge-module|all-module), script-path=https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/Rewrite-Parser.js, timeout=300

[MITM]
hostname = *.youtube.com, youtubei.googleapis.com, *.googlevideo.com, script.hub, *.script.hub, ddgksf2013.top, *.google.cn, -consumer.fcbox.com, -*huami.com, -*amemv.com, -*snssdk.com
enable = true
