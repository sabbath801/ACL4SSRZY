# Mihomo (Clash Meta) 配置 - 基于你的 clash.ini 定制
# 兼容 mihomo 1.18+ / Clash Verge Rev / CMFA 等

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
find-process-mode: strict
external-controller: 127.0.0.1:9090
# secret: "your-password"   # 如需面板密码可取消注释

# DNS 推荐配置（防污染 + 防泄漏）
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "lens.l.google.com"
    - "*.n.n.srv.nintendo.net"
    - "+.msftconnecttest.com"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"
    - "*.ipv6.microsoft.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.apple.com"
    - "time1.*.com"
    - "time2.*.com"
    - "time3.*.com"
    - "time4.*.com"
    - "time5.*.com"
    - "time6.*.com"
    - "time7.*.com"
    - "ntp.*.com"
    - "ntp1.*.com"
    - "ntp2.*.com"
    - "ntp3.*.com"
    - "ntp4.*.com"
    - "ntp5.*.com"
    - "ntp6.*.com"
    - "ntp7.*.com"
    - "*.time.edu.cn"
    - "*.ntp.org.cn"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.githubusercontent.com"

# 代理提供者（请把你的订阅链接填在这里）
proxy-providers:
  my-subscription:
    type: http
    url: "你的订阅链接"
    interval: 3600
    path: ./providers/my-subscription.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600
      # lazy: true

# 规则提供者（对应你原来的 ruleset）
rule-providers:
  # 全球拦截
  BanAD:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list"
    path: ./ruleset/BanAD.yaml
    interval: 86400
  BanProgramAD:
