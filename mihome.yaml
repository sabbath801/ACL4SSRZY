# 策略组（完全按你原 ini 的逻辑）
proxy-groups:
  - name: "♻️ 自动选择"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    # 过滤掉含 2026、更新、静态 以及结尾是 1/2 的节点
    filter: "^(?!.*(2026|更新|静态))(?!.*[^0-9][12]$).*"
    use:
      - my-subscription
    # 如果订阅已经解析成 proxies，也可以写 proxies: ["*"]

  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - DIRECT
    use:
      - my-subscription

  - name: "🚀 手动切换"
    type: select
    proxies:
      - "♻️ 自动选择"
      - DIRECT
    use:
      - my-subscription

  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - "🚀 手动切换"

  - name: "📹 油管视频"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - "🚀 手动切换"

  - name: "📢 谷歌服务"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - "🚀 手动切换"

  - name: "🍎 苹果服务"
    type: select
    proxies:
      - DIRECT
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - "🚀 手动切换"

  - name: "💬 微软服务"
    type: select
    proxies:
      - DIRECT
      - "♻️ 自动选择"
      - "🚀 节点选择"
      - "🚀 手动切换"

  - name: "🛑 全球拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🚀 手动切换"
      - DIRECT

# 规则顺序（与原 ini 保持一致）
rules:
  - RULE-SET,BanAD,🛑 全球拦截
  - RULE-SET,BanProgramAD,🛑 全球拦截
  - RULE-SET,ProxyDomain,🚀 节点选择
  - RULE-SET,DirectCustom,🎯 全球直连
  - RULE-SET,Talkatone,📢 谷歌服务
  - RULE-SET,Twitter,📹 油管视频
  - RULE-SET,TikTok,📹 油管视频
  - RULE-SET,YouTube,📹 油管视频
  - RULE-SET,Apple,🍎 苹果服务
  - RULE-SET,GitHub,📢 谷歌服务
  - RULE-SET,Google,📢 谷歌服务
  - RULE-SET,Cloudflare,📢 谷歌服务
  - RULE-SET,Microsoft,💬 微软服务
  - RULE-SET,GlobalMedia,🚀 节点选择
  - RULE-SET,Proxy,🚀 节点选择
  - RULE-SET,ChinaMedia,🎯 全球直连
  - RULE-SET,Direct,🎯 全球直连
  - RULE-SET,China,🎯 全球直连
  - RULE-SET,ChinaCompanyIp,🎯 全球直连
  - RULE-SET,LocalAreaNetwork,🎯 全球直连
  - GEOIP,CN,🎯 全球直连
  - MATCH,🐟 漏网之鱼
